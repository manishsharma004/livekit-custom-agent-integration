apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: voice-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      enableServiceLinks: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          args: ["--config", "/etc/livekit/livekit.yaml"]
          ports:
            - containerPort: 7880
            - containerPort: 7881
            - containerPort: 50000
              protocol: UDP
            - containerPort: 50100
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: voice-agent-system
spec:
  selector:
    app: livekit
  type: ClusterIP
  ports:
    - name: ws
      port: 7880
      targetPort: 7880
    - name: tcp-rtc
      port: 7881
      targetPort: 7881
