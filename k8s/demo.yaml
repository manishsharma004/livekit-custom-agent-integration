apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-demo
  namespace: voice-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-demo
  template:
    metadata:
      labels:
        app: voice-demo
    spec:
      enableServiceLinks: false
      containers:
        - name: voice-demo
          image: livekit-integration:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - voice_agent.demo:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          envFrom:
            - secretRef:
                name: voice-agent-secrets
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: voice-demo
  namespace: voice-agent-system
spec:
  type: NodePort
  selector:
    app: voice-demo
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
